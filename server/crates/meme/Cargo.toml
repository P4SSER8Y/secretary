[package]
name = "meme"
version.workspace = true
edition.workspace = true

[features]
default = []
avif = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rocket = { version = "0.5.0", features = ["json"] }
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
utils = { path = "../utils" }
anyhow = "1.0.79"
figment = "0.10.13"
log = "0.4.20"
once_cell = "1.19.0"
rust-s3 = { version = "0.35", default-features = false, features = [
    "tokio-rustls-tls",
] }
serde_yaml = "0.9.34"
chrono = { version = "0.4.38", features = ["serde"] }
jsonwebtoken = { version = "9.3.1", features = ["use_pem"] }
base64 = "0.22.1"
rand = "0.9.0"
url = "2.5.4"
uuid = { version = "1.16.0", features = ["v4"] }
image = { version = "0.25.6", features = [
    "avif",
    "bmp",
    "gif",
    "jpeg",
    "png",
    "webp",
] }
rust-crypto = "0.2.36"
regex = "1.11.1"
palette = "0.7.6"
thiserror = "2.0.12"
tempfile = "3.20.0"
tokio = { version = "1.47.1", features = ["process"] }
aes-gcm = "0.10"
