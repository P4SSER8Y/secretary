name: build (merged, manual)

# 可选的一体化版本：把 develop.yml + release.yml 合并成一个工作流，按 ref 分派
# （分支 push → 上传 artifact；tag push → 发 release）。当前是手动触发，避免和
# develop.yml / release.yml 重复跑。想改用它：把下面 `on:` 换成
#     on:
#       push:
#         branches: ['**']
#         tags: ['v*']
# 然后删掉 develop.yml 和 release.yml 两个文件即可。
on:
  workflow_dispatch:

jobs:
  main:
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable
      - name: Install cross-compilation tools for Rust
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - name: Install dependencies
        run: make -j update-ui update-server
      - name: Build & package
        run: make -j package TARGET=${{ matrix.target }}
        env:
          VITE_HODOR_ENTRY: ${{ secrets.HODOR_ENTRY }}
      - name: Show artifacts
        run: tree ./
        working-directory: ./build
      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: secretary_${{ matrix.target }}
          path: ./build/secretary_${{ matrix.target }}.tar.gz
          if-no-files-found: error
          overwrite: true
      - name: Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          files: ./build/secretary_${{ matrix.target }}.tar.gz
