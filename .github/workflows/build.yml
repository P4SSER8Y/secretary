name: build

# 一次 push 只跑一个工作流：分支 push 传到 artifact，tag push 发 release。
# 原来 develop.yml（`on: push:` 没过滤）+ release.yml 会在打 tag 时各跑一遍同样的编译，
# 而且每个 job 里 UI/Rust 还要编两遍（`make` 之后又 `make package`，而 package 已依赖 all）。
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  main:
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable
      - name: Install cross-compilation tools for Rust
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - name: Install dependencies
        # 只装 ui + server 依赖；rsign2（update-rsign）只有 `make sign` 用得到
        run: make -j update-ui update-server
      - name: Build & package
        # `make package` 的依赖里已经含 `all`（ui + server），不必先单独跑一次 make
        run: make -j package TARGET=${{ matrix.target }}
        env:
          VITE_HODOR_ENTRY: ${{ secrets.HODOR_ENTRY }}
      - name: Show artifacts
        run: tree ./
        working-directory: ./build
      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: secretary_${{ matrix.target }}
          path: ./build/secretary_${{ matrix.target }}.tar.gz
          if-no-files-found: error
          overwrite: true
      - name: Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          files: ./build/secretary_${{ matrix.target }}.tar.gz
